name: Secret scan

# v2.4.9 Phase 2 -- gitleaks over the full history.
#
# D2 (answered 2026-09-10) flipped this to GATING, and the reason is the
# measurement rather than a policy preference. A full-history scan of 750
# commits (~40 MB) returned 16 findings across 9 files, every one a synthetic
# test fixture or a false positive, all justified in `.gitleaks.toml`. The
# residual after the allowlist is ZERO, re-verified against the same scan.
#
# Gating an empty backlog costs nothing today, and it means any red run is
# genuinely new information. So: a RED run means something arrived that is not
# in the allowlist. Read it. Widening `.gitleaks.toml` is correct only after
# confirming the value is not a live secret; the answer to a real one is
# rotation and history surgery, never an allowlist line.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # Cost control, mirroring codeql.yml: a dependency bump cannot introduce a
    # secret into history that the push-to-branch run would not also catch.
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history: the point is the backlog, not just the tip. A shallow
          # clone would report a clean tree and prove nothing.
          fetch-depth: 0

      - name: Run gitleaks
        id: scan
        # `--redact` keeps matched values out of the public log. A maintainer
        # who needs the value reads the file at the reported path.
        run: |
          set -u
          version="8.30.1"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks.sarif \
            || echo "findings=true" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.scan.outputs.findings }}" = "true" ]; then
            echo "::warning::gitleaks reported findings. This job is reporting-only (D2 owns the gate). Download the gitleaks-sarif artifact to triage; do not widen .gitleaks.toml without confirming the value is not a live secret."
          else
            echo "gitleaks: no findings against .gitleaks.toml"
          fi
