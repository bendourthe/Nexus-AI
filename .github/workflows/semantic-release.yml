name: Release Readiness

# Release source is prepared through reviewed develop/main pull requests.
# This manual check only validates that source; release.yml alone packages
# and publishes an existing, verified tag. It never creates commits or tags.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed source ref to check before tagging"
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.inputs.source_ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Check release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Release artifact matrix parity
        run: node scripts/check-release-assets.mjs

      - name: Validate the exact version's release notes
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/extract-release-notes.mjs "$VERSION" CHANGELOG.md release-readiness-notes.md
