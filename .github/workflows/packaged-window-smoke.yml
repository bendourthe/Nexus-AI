name: Packaged window smoke

# Launches the Windows release executable and feeds the live probe to
# desktop/tests/packaged/bundle.smoke.mjs. The probe opens the debug port
# through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS at launch. This workflow
# does not patch tauri.conf.json, so the smoked exe is a normal shell build.
# A push of this file runs it once on develop. It is not part of the ubuntu shell job.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/packaged-window-smoke.yml
      - desktop/tests/packaged/launch-probe.mjs
      - desktop/tests/packaged/image-edit-flow.mjs
      - desktop/tests/packaged/seed-image.mjs
      - desktop/tests/packaged/smoke.mjs
      - desktop/src-tauri/src/lib.rs
      - desktop/src-tauri/tauri.conf.json

concurrency:
  group: packaged-window-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Launch Windows bundle and judge the probe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install workspace deps
        working-directory: .
        run: npm ci --prefer-offline --no-audit

      - name: Build the Windows shell
        run: npm run build:shell

      - name: Probe the launched window
        run: node tests/packaged/launch-probe.mjs src-tauri/target/release/nexus-shell.exe

      # v2.16.2 (T016): the behavioral check edits a synthetic fixture image in an
      # owned throwaway profile, restarts the app and verifies the saved edit,
      # its pixels and the unchanged source. Node 22 here matches the sidecar ABI.
      - name: Packaged image edit, restart and render
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/nexus-shell.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $node = (Get-Command node).Source
          node tests/packaged/image-edit-flow.mjs --exe $exe --sha256 $sha --node $node --out "$env:RUNNER_TEMP/image-edit-check"

      - name: Upload image edit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: packaged-image-edit-report
          path: ${{ runner.temp }}/image-edit-check/report.json
          if-no-files-found: warn
          retention-days: 14
