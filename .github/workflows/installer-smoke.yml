name: Installer smoke tests

# Verifies the PyQt5 installer works end-to-end on each platform in headless
# mode, plus a model-catalog reachability probe (v1.13.0 Phase 2). The full
# pull+load preflight (multi-GB, needs a Gemma-4-capable Ollama) is
# intentionally NOT wired here -- it stays a local
# `nexus-installer --preflight` / NEXUS_MODEL_PREFLIGHT=1 run (known-gaps IR.P1.E).
#
# v2.4.9 Phase 2 -- fires on installer-touching pull requests, not only on the
# monthly cron. An installer regression previously had up to a month to sit
# undiscovered, which is the wrong shape for the one artifact a field tester
# actually runs.
#
# THIS COSTS MORE, and the cost is stated rather than glossed. Billing
# multipliers are Linux 1x, Windows 2x, macOS 10x, and the ceiling is each
# job's timeout:
#
#   full matrix : windows 30x2=60, macOS 30x10=300, linux 30x1=30,
#                 preflight 10x1=10  ->  400 billed minutes per run
#   PR matrix   : macOS excluded     ->  100 billed minutes per run
#
# So the monthly cron stays at ~400 billed minutes per month, and each
# installer-touching PR adds ~100. At roughly four such PRs a month this
# doubles the workflow's spend. It does not reduce it, and no claim is made
# that it does.
#
# macOS is excluded from the PR runs specifically because its 10x multiplier
# is 75 percent of a full run's cost on its own; it keeps full monthly
# coverage via the cron. If a macOS-only installer regression ever ships, that
# trade is the thing to revisit.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 1 * *"  # 05:00 UTC monthly (1st). Was weekly -- throttled to cut CI-minute cost.
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "scripts/installer/**"
      - ".github/workflows/installer-smoke.yml"

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-windows:
    name: Windows smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install VS Code
        run: choco install vscode --no-progress -y
      - name: Install installer deps
        # The headless installer imports httpx (engine/ollama_installer.py); the
        # macOS/Linux smoke jobs already install these, but the Windows job was
        # missing the step, so the run crashed with ModuleNotFoundError: httpx.
        run: pip install PyQt5 httpx
      - name: Run smoke test
        run: pwsh -File tests/smoke/smoke-windows.ps1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: smoke-windows-results
          path: tests/smoke/results/
          retention-days: 14

  smoke-macos:
    name: macOS smoke test
    runs-on: macos-latest
    timeout-minutes: 30
    # 10x billing multiplier, ~300 of a full run's 400 billed minutes. Kept on
    # the monthly cron and manual dispatch; skipped on pull requests so the new
    # PR trigger costs ~100 billed minutes instead of ~400.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install VS Code
        run: brew install --cask visual-studio-code
      - name: Install installer deps
        run: pip install PyQt5 httpx
      - name: Run smoke test
        run: bash tests/smoke/smoke-macos.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: smoke-macos-results
          path: tests/smoke/results/
          retention-days: 14

  smoke-linux:
    name: Linux smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg libxcb-xinerama0 libxkbcommon-x11-0
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list
          sudo apt-get update
          sudo apt-get install -y code
      - name: Install installer deps
        run: pip install PyQt5 httpx
      - name: Run smoke test
        run: bash tests/smoke/smoke-linux.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: smoke-linux-results
          path: tests/smoke/results/
          retention-days: 14

  preflight-reachability:
    name: Model catalog reachability probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install the installer package
        run: pip install ./scripts/installer
      - name: Probe every catalog model's source reachability (no download)
        # v1.13.0 Phase 2: exits 1 if any DEFAULT model's source is gated or
        # dead. Network (Hugging Face HEAD + Ollama registry manifest) but no
        # weight download, so it is cheap enough for the monthly cron.
        run: nexus-installer --reachability
